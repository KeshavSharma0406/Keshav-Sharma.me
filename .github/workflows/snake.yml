name: Generate snake animation

"on":
  schedule:
    - cron: "17 6 * * *" # about 06:17 UTC, daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake from this account's contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # A separate branch keeps main free of daily commits. GitHub doesn't count
      # commits on this branch toward the contribution graph, so the snake can't
      # inflate the data it draws.
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation"
          author: "Keshav Sharma <100477734+KeshavSharma0406@users.noreply.github.com>"
          committer: "Keshav Sharma <100477734+KeshavSharma0406@users.noreply.github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
